      "EDL Маркери": `Добре, я обираю кліп . Тепер створи для нього розмітку маркерів зі стріму на монтаж. Пам'ятай, нам треба провести глядача в контексті з початку відео і до його кінця, тобто без фраз що вирвані із контексту.

Твоє завдання — згенерувати точний код формату CMX 3600 EDL, який я імпортую в DaVinci Resolve 20. 
Частота кадрів відео (FPS): 60.

ГОЛОВНЕ ПРАВИЛО ЧОРНОВОГО МОНТАЖУ (Rough Cut): Не роби один суцільний маркер на весь кліп! Ти маєш розбити його на кілька маркерів тривалості (Ranged Markers), ВИКЛЮЧАЮЧИ все сміття. Пропускай і НЕ маркуй: паузи, відповіді на донати, читання чату, відволікання чи технічні моменти. У нарізку (під маркер) має потрапити тільки сама суть історії, динаміка чи жарт.

Правила синтаксису EDL для DaVinci 20:
1. Заголовок: На початку коду обов'язково напиши:
TITLE: Stream Markers
FCM: NON-DROP FRAME

2. Структура події: Кожен маркер складається строго з ДВОХ рядків:
- Перший рядок (фіктивна склейка): Порядковий номер (зростає: 001, 002...), AX, V, C, і таймкоди початку/кінця корисного відрізка (дублюються двічі).
- Другий рядок (метадані): Теги кольору, короткого опису відрізка та ТРИВАЛОСТІ в кадрах.

3. Розрахунок тривалості (|D:):
Маркер тривалості визначається тегом |D:[кількість_кадрів]. Вирахуй тривалість КОЖНОГО корисного відрізка у секундах і помнож на вказаний FPS. Наприклад, якщо чистий відрізок триває 15 секунд при 60 fps, тег має бути |D:900.

4. Формат таймкоду: ГГ:ХХ:СС:КК (де КК — кадри, завжди став 00).

Приклад того, як має виглядати виділення корисних відрізків із пропуском сміття між ними:
001  AX  V  C  01:15:30:00 01:15:45:00 01:15:30:00 01:15:45:00
 |C:ResolveColorGreen |M:Зав'язка історії |D:900
002  AX  V  C  01:16:05:00 01:16:20:00 01:16:05:00 01:16:20:00
 |C:ResolveColorGreen |M:Кульмінація (після донату) |D:900

Інструкції до виконання:
- Проаналізуй обраний кліп і розбий його на серію зелених маркерів тривалості (|C:ResolveColorGreen), вирізавши "воду".
- Якщо всередині кліпу є найсмішніший/найважливіший момент (панчлайн), додай для нього окремий звичайний маркер-крапку (|D:1, колір ResolveColorYellow) на точній секунді.`
    };

    // Комбінації (ланцюжки кроків з посиланнями на промти)
    const workflows = {
      "Shorts Хайлайти": [
        {
          title: "Крок 1 — Нарізка Shorts",
          promptKey: "Нарізка S"
        },
        {
          title: "Крок 2 — DaVinci Скрипт",
          promptKey: "DaVinci Скрипт"
        },
        {
          title: "Крок 3 — YouTube SEO",
          promptKey: "YouTube SEO"
        }
      ]
    };

    // Безпечне екранування символів
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Відображення одного промту
    function showPrompt(title) {
      const content = document.getElementById('content');
      if (prompts[title]) {
        const text = prompts[title];
        content.innerHTML = `
          <div class="prompt-title">${title}</div>
          <button class="copy-btn" onclick="copyText('${title}', this)">Копіювати</button>
          <div class="prompt-text" id="prompt-text">${escapeHtml(text)}</div>
        `;
      } else {
        content.innerHTML = `<p>Помилка: Промт не знайдено.</p>`;
      }
    }

    // Відображення комбінації кроків
    function showWorkflow(name) {
      const content = document.getElementById('content');
      const steps = workflows[name];
      if (!steps) {
        content.innerHTML = `<p>Помилка: Комбінацію не знайдено.</p>`;
        return;
      }

      let html = `<div class="prompt-title">Комбінація: ${name}</div>`;

      steps.forEach((step, index) => {
        const promptText = prompts[step.promptKey] || '';
        html += `
          <div class="workflow-step">
            <h3 class="step-title">${step.title}</h3>
            <button class="copy-btn" onclick="copyText('${step.promptKey}', this)">Копіювати</button>
            <div class="prompt-text collapsed" id="wf-step-${index}">${escapeHtml(promptText)}</div>
            <button class="toggle-btn" onclick="toggleStep('wf-step-${index}', this)">Розгорнути ▼</button>
          </div>
        `;
      });

      content.innerHTML = html;

      // Автоматично приховуємо кнопку розгортання, якщо текст вміщується в 5 рядків
      steps.forEach((step, index) => {
        const el = document.getElementById(`wf-step-${index}`);
        const btn = el ? el.nextElementSibling : null;
        if (el && el.scrollHeight <= el.clientHeight + 4) {
          el.classList.remove('collapsed');
          if (btn && btn.classList.contains('toggle-btn')) {
            btn.style.display = 'none';
          }
        }
      });
    }

    // Розгортання та згортання тексту кроку
    function toggleStep(id, btn) {
      const el = document.getElementById(id);
      if (el.classList.contains('collapsed')) {
        el.classList.remove('collapsed');
        btn.innerText = 'Згорнути ▲';
      } else {
        el.classList.add('collapsed');
        btn.innerText = 'Розгорнути ▼';
      }
    }

    // Копіювання в буфер обміну
    function copyText(title, btnElement) {
      const text = prompts[title];
      if (!text) return;
      navigator.clipboard.writeText(text);
      const btn = btnElement || document.querySelector('.copy-btn');
      if (btn) {
        const originalText = btn.innerText;
        btn.innerText = "Скопійовано!";
        setTimeout(() => btn.innerText = originalText, 1500);
      }
    }
  </script>
</body>
</html>
